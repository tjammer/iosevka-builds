d = "flat-bottom-serifless"
f = "flat-hook-serifless"
g = "single-storey-flat-hook-earless-corner"
i = "serifed"
l = "serifed"
m = "flat-top-serifless"
n = "flat-top-straight-serifless"
p = "flat-top-serifless"
q = "earless-corner-straight-serifless"
