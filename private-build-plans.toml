[buildPlans.Mpluska]
family = "Mpluska"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
noLigation = true

[buildPlans.Mpluska.variants.design]
two = "straight-neck-serifless"
four = "semi-open-non-crossing-serifless"
five = "upright-flat-serifless"
six = "open-contour"
seven = "bend-serifless"
eight = "two-circles"
nine = "open-contour"
zero = "oval-dotted"
capital-c = "unilateral-inward-serifed"
capital-d = "more-rounded-serifless"
capital-g = "toothless-corner-serifless-hooked"
capital-k = "symmetric-connected-serifless"
capital-q = "straight"
capital-s = "unilateral-inward-serifed"
capital-u = "toothless-corner-serifless"
capital-w = "straight-almost-flat-top-serifless"
a = "double-storey-toothless-corner"
b = "toothless-corner-serifless"
c = "unilateral-inward-serifed"
d = "toothless-corner-serifless"
g = "single-storey-flat-hook-earless-corner"
i = "hooky"
j = "flat-hook-serifed"
k = "symmetric-connected-serifless"
l = "tailed-serifed"
m = "earless-corner-double-arch-serifless"
n = "earless-corner-straight-serifless"
p = "earless-corner-serifless"
q = "earless-corner-straight-serifless"
r = "hookless-serifless"
s = "unilateral-inward-serifed"
t = "bent-hook-short-neck"
u = "toothless-corner-serifless"
w = "straight-flat-top-serifless"
y = "straight-turn-serifless"
asterisk = "penta-low"

[buildPlans.Mpluska.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.Mpluska.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.Mpluska.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.Mpluska.slopes.Italic]
angle = 11.8
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.Mpluska.widths.normal]
shape = 548
menu = 5
css = "normal"
